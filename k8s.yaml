# ---------- API (Flask) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: potioncraft-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: potioncraft-api
  template:
    metadata:
      labels:
        app: potioncraft-api
    spec:
      containers:
        - name: api
          image: potioncraft-api:latest
          imagePullPolicy: Never   # image locale, construite par docker compose
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: potioncraft-api
spec:
  type: LoadBalancer   # Docker Desktop l'expose sur localhost
  selector:
    app: potioncraft-api
  ports:
    - port: 8081       # port sur ton PC (le JS appelle localhost:8081)
      targetPort: 80   # port du container
---
# ---------- Frontend (nginx) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: potioncraft-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: potioncraft-frontend
  template:
    metadata:
      labels:
        app: potioncraft-frontend
    spec:
      containers:
        - name: frontend
          image: potioncraft-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: potioncraft-frontend
spec:
  type: LoadBalancer
  selector:
    app: potioncraft-frontend
  ports:
    - port: 8080
      targetPort: 80